<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 CineBook · interactive movie tickets</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b0f1c 0%, #1a1f2f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .app-container {
      max-width: 1200px;
      width: 100%;
      background: rgba(18, 22, 33, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 2.5rem;
      padding: 2rem 2rem 2.5rem;
      box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 215, 100, 0.15);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #f5e9d8;
      margin-bottom: 0.15rem;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    h1 span {
      background: linear-gradient(135deg, #f5c542, #e6a520);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: 2rem;
    }

    .subhead {
      color: #a7b1c2;
      margin-bottom: 2rem;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.3px;
      border-left: 3px solid #f5c542;
      padding-left: 0.9rem;
      display: inline-block;
    }

    /* main layout */
    .main-panel {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 2rem;
      align-items: start;
    }

    /* movie grid / ticket list */
    .movie-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .movie-card {
      background: rgba(28, 33, 48, 0.7);
      border-radius: 1.8rem;
      padding: 1.2rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(245, 197, 66, 0.2);
      box-shadow: 0 10px 20px -8px black;
      transition: all 0.2s ease;
      backdrop-filter: blur(5px);
    }

    .movie-card.selected {
      border-color: #f5c542;
      background: rgba(45, 40, 30, 0.8);
      box-shadow: 0 0 0 1px #f5c542, 0 15px 25px -10px #000000;
      transform: scale(1.01);
    }

    .movie-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .poster {
      width: 3.2rem;
      height: 3.2rem;
      background: linear-gradient(135deg, #30384b, #1b1f2b);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: inset 0 0 0 1px rgba(255, 215, 100, 0.2);
      color: #f5c542;
    }

    .movie-details h3 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #f0e8dd;
      margin-bottom: 0.2rem;
    }

    .meta {
      display: flex;
      gap: 0.8rem;
      font-size: 0.8rem;
      color: #9aa6b9;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .meta span {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .price-tag {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f5c542;
      background: rgba(245, 197, 66, 0.1);
      padding: 0.25rem 1rem;
      border-radius: 3rem;
      border: 1px solid rgba(245, 197, 66, 0.3);
      white-space: nowrap;
    }

    /* seat / ticket interaction */
    .seat-area {
      background: rgba(22, 27, 40, 0.8);
      border-radius: 2rem;
      padding: 1.5rem 1.5rem 1.8rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
    }

    .screen-visual {
      background: #1e2538;
      height: 3rem;
      border-radius: 50% 50% 20% 20% / 60% 60% 20% 20%;
      margin: 0 1rem 1.8rem 1rem;
      box-shadow: 0 15px 25px -10px #f5c54240, 0 0 0 1px #f5c54230;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5c54290;
      font-size: 0.75rem;
      letter-spacing: 4px;
      font-weight: 500;
      text-transform: uppercase;
      transform: perspective(500px) rotateX(5deg);
    }

    .seats-container {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      align-items: center;
      margin-bottom: 2rem;
    }

    .row {
      display: flex;
      gap: 0.7rem;
      justify-content: center;
    }

    .seat {
      width: 2.3rem;
      height: 2.3rem;
      border-radius: 0.7rem 0.7rem 0.5rem 0.5rem;
      background: #2e3648;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
      color: #8c99b0;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid #414b60;
      box-shadow: 0 4px 0 #0f1118;
      user-select: none;
    }

    .seat.selected {
      background: #f5c542;
      color: #1a1f2b;
      border-color: #f5c542;
      box-shadow: 0 4px 0 #b58e1f;
      transform: translateY(-1px);
      font-weight: 700;
    }

    .seat.occupied {
      background: #1f2533;
      color: #414b60;
      border-color: #2b3242;
      box-shadow: 0 4px 0 #0b0e13;
      cursor: not-allowed;
      opacity: 0.7;
      pointer-events: none;
      position: relative;
    }

    .seat.occupied::after {
      content: "✕";
      font-size: 0.9rem;
      color: #4b5568;
    }

    .seat:not(.occupied):hover {
      background: #3e4a62;
      border-color: #6e7d9e;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #0f1118;
    }

    /* booking summary */
    .summary {
      background: rgba(16, 20, 30, 0.8);
      border-radius: 1.6rem;
      padding: 1.2rem 1.5rem;
      border: 1px solid #2b3242;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.5rem;
    }

    .selected-info {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .selected-info .label {
      font-size: 0.8rem;
      color: #8895aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .selected-info .value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f0e8dd;
    }

    .selected-seats {
      color: #f5c542;
      font-weight: 600;
    }

    .book-btn {
      background: #f5c542;
      border: none;
      border-radius: 3rem;
      padding: 0.9rem 2rem;
      font-weight: 700;
      font-size: 1rem;
      color: #11161f;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 20px -8px #f5c54270;
      letter-spacing: 0.3px;
      border: 1px solid #ffda7a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .book-btn:disabled {
      background: #2d3444;
      color: #5b677d;
      box-shadow: none;
      border-color: #3e475b;
      cursor: not-allowed;
      transform: none;
      pointer-events: none;
    }

    .book-btn:not(:disabled):hover {
      background: #ffd966;
      transform: scale(1.02);
      box-shadow: 0 15px 25px -8px #f5c542;
    }

    .book-btn:not(:disabled):active {
      transform: scale(0.98);
    }

    .booking-message {
      margin-top: 1.2rem;
      color: #b9c7dd;
      background: #1e2639;
      padding: 0.8rem 1.2rem;
      border-radius: 3rem;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-left: 4px solid #f5c542;
      transition: all 0.3s ease;
    }

    .booking-message.success {
      background: #1b3b2b;
      border-left-color: #4cd964;
      color: #d2f0dc;
    }

    /* responsive */
    @media (max-width: 800px) {
      .main-panel {
        grid-template-columns: 1fr;
      }

      .app-container {
        padding: 1.5rem;
      }

      h1 {
        font-size: 2rem;
      }
    }

    @media (max-width: 480px) {
      .movie-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.8rem;
      }

      .seat {
        width: 2rem;
        height: 2rem;
        font-size: 0.6rem;
      }

      .row {
        gap: 0.4rem;
      }

      .summary {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }

      .book-btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h1>
      <span>🎟️</span> CineBook
    </h1>
    <div class="subhead">select a show · pick your seats · book instantly</div>

    <div class="main-panel">
      <!-- left: movie tickets (interactive list) -->
      <div class="movie-grid" id="movieGrid">
        <!-- movie 1 -->
        <div class="movie-card" data-movie-id="0" data-title="Dune: Part Two" data-price="12.5">
          <div class="movie-info">
            <div class="poster">🏜️</div>
            <div class="movie-details">
              <h3>Dune: Part Two</h3>
              <div class="meta">
                <span>⏱ 2h 46m</span>
                <span>⭐ 8.8</span>
              </div>
            </div>
          </div>
          <div class="price-tag">$12.50</div>
        </div>

        <!-- movie 2 -->
        <div class="movie-card" data-movie-id="1" data-title="Oppenheimer" data-price="11.0">
          <div class="movie-info">
            <div class="poster">⚛️</div>
            <div class="movie-details">
              <h3>Oppenheimer</h3>
              <div class="meta">
                <span>⏱ 3h 0m</span>
                <span>⭐ 8.6</span>
              </div>
            </div>
          </div>
          <div class="price-tag">$11.00</div>
        </div>

        <!-- movie 3 -->
        <div class="movie-card" data-movie-id="2" data-title="Barbie" data-price="10.5">
          <div class="movie-info">
            <div class="poster">🎀</div>
            <div class="movie-details">
              <h3>Barbie</h3>
              <div class="meta">
                <span>⏱ 1h 54m</span>
                <span>⭐ 7.2</span>
              </div>
            </div>
          </div>
          <div class="price-tag">$10.50</div>
        </div>
      </div>

      <!-- right: interactive seat selection & booking -->
      <div class="seat-area">
        <div class="screen-visual">SCREEN</div>

        <!-- seats will be rendered by js -->
        <div class="seats-container" id="seatsContainer"></div>

        <div class="summary">
          <div class="selected-info">
            <div class="label">Selected seats</div>
            <div class="value selected-seats" id="selectedSeatsDisplay">—</div>
            <div class="label" style="margin-top: 0.3rem;">Total</div>
            <div class="value" id="totalPriceDisplay">$0.00</div>
          </div>
          <button class="book-btn" id="bookBtn" disabled>
            <span>🎫</span> Book tickets
          </button>
        </div>

        <div class="booking-message" id="bookingMessage">
          ✨ Select a movie and seats to begin
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ---------- state ----------
      const movies = [
        { id: 0, title: 'Dune: Part Two', price: 12.5 },
        { id: 1, title: 'Oppenheimer', price: 11.0 },
        { id: 2, title: 'Barbie', price: 10.5 }
      ];

      // seat layout: 6 rows (A–F) x 8 seats per row
      const ROWS = ['A', 'B', 'C', 'D', 'E', 'F'];
      const SEATS_PER_ROW = 8;

      // Occupied seats (predefined – these seats are taken)
      const OCCUPIED_SEATS = new Set([
        'A3', 'A4', 'A5', 'B2', 'B7', 'C1', 'C8', 'D4', 'D5', 'E3', 'E6', 'F1', 'F2', 'F7'
      ]);

      // global state
      let selectedMovieId = 0;                // default first movie (index 0)
      let selectedSeats = new Set();          // e.g., "A1", "B4"
      
      // DOM elements
      const movieCards = document.querySelectorAll('.movie-card');
      const seatsContainer = document.getElementById('seatsContainer');
      const selectedSeatsDisplay = document.getElementById('selectedSeatsDisplay');
      const totalPriceDisplay = document.getElementById('totalPriceDisplay');
      const bookBtn = document.getElementById('bookBtn');
      const bookingMessage = document.getElementById('bookingMessage');

      // helper: get current movie object
      function getCurrentMovie() {
        return movies.find(m => m.id === selectedMovieId) || movies[0];
      }

      // ---------- render seats (with occupancy and selection state) ----------
      function renderSeats() {
        seatsContainer.innerHTML = '';

        ROWS.forEach(rowLetter => {
          const rowDiv = document.createElement('div');
          rowDiv.className = 'row';

          for (let seatNum = 1; seatNum <= SEATS_PER_ROW; seatNum++) {
            const seatId = `${rowLetter}${seatNum}`;  // e.g., "A1"
            const seatDiv = document.createElement('div');
            seatDiv.className = 'seat';
            seatDiv.dataset.seatId = seatId;
            seatDiv.textContent = seatId;

            // check occupancy
            if (OCCUPIED_SEATS.has(seatId)) {
              seatDiv.classList.add('occupied');
            } else {
              // if the seat is in selectedSeats, mark as selected
              if (selectedSeats.has(seatId)) {
                seatDiv.classList.add('selected');
              }
            }

            // add click listener (only if not occupied)
            seatDiv.addEventListener('click', (e) => {
              e.stopPropagation();
              const id = seatDiv.dataset.seatId;
              if (OCCUPIED_SEATS.has(id)) return; // safety

              // toggle selection
              if (selectedSeats.has(id)) {
                selectedSeats.delete(id);
                seatDiv.classList.remove('selected');
              } else {
                selectedSeats.add(id);
                seatDiv.classList.add('selected');
              }

              // update summary UI & button state
              updateSummary();
              updateBookButtonState();
              // remove any success/error message styling on new interaction
              bookingMessage.classList.remove('success');
              bookingMessage.textContent = '✨ ' + (selectedSeats.size ? 'Seats updated' : 'Select seats to book');
            });

            rowDiv.appendChild(seatDiv);
          }
          seatsContainer.appendChild(rowDiv);
        });
      }

      // ---------- update selected seats display & total price ----------
      function updateSummary() {
        const movie = getCurrentMovie();
        const seatsArray = Array.from(selectedSeats).sort(); // alphabetical

        // update seats text
        if (seatsArray.length === 0) {
          selectedSeatsDisplay.textContent = '—';
        } else {
          selectedSeatsDisplay.textContent = seatsArray.join(', ');
        }

        // total price: number of seats * movie price
        const total = selectedSeats.size * movie.price;
        totalPriceDisplay.textContent = `$${total.toFixed(2)}`;
      }

      // ---------- enable/disable book button based on seats ----------
      function updateBookButtonState() {
        if (selectedSeats.size > 0) {
          bookBtn.disabled = false;
        } else {
          bookBtn.disabled = true;
        }
      }

      // ---------- highlight active movie card ----------
      function updateActiveMovieCard() {
        movieCards.forEach(card => {
          const movieId = parseInt(card.dataset.movieId, 10);
          if (movieId === selectedMovieId) {
            card.classList.add('selected');
          } else {
            card.classList.remove('selected');
          }
        });
      }

      // ---------- reset selected seats when switching movie (keeps occupancy but clears selection) ----------
      function resetSeatSelection() {
        selectedSeats.clear();
        // re-render seats to clear visual selection
        renderSeats();
        updateSummary();
        updateBookButtonState();
      }

      // ---------- handle movie selection ----------
      movieCards.forEach(card => {
        card.addEventListener('click', () => {
          const movieId = parseInt(card.dataset.movieId, 10);
          if (movieId === selectedMovieId) return; // already active

          // set new movie
          selectedMovieId = movieId;
          updateActiveMovieCard();

          // reset selected seats (clears any previous selection)
          resetSeatSelection();

          // update message
          bookingMessage.classList.remove('success');
          const movie = getCurrentMovie();
          bookingMessage.textContent = `🎬 Now browsing: ${movie.title} · $${movie.price.toFixed(2)} per ticket`;
        });
      });

      // ---------- book tickets action ----------
      bookBtn.addEventListener('click', () => {
        const movie = getCurrentMovie();
        const seatsArray = Array.from(selectedSeats).sort();

        if (seatsArray.length === 0) {
          bookingMessage.textContent = '⚠️ Please select at least one seat.';
          bookingMessage.classList.remove('success');
          return;
        }

        // simulate booking: mark seats as occupied in the OCCUPIED_SEATS set
        seatsArray.forEach(seat => {
          OCCUPIED_SEATS.add(seat);
        });

        // clear selection (since they are now booked)
        selectedSeats.clear();

        // re-render seats to reflect newly occupied seats
        renderSeats();

        // update summary and button state
        updateSummary();
        updateBookButtonState();

        // success message with total
        const totalPaid = seatsArray.length * movie.price;
        bookingMessage.textContent = `✅ Booked ${seatsArray.length} seat(s) for "${movie.title}" — $${totalPaid.toFixed(2)}. Enjoy!`;
        bookingMessage.classList.add('success');

        // (the booked seats are now occupied, so they can't be selected again)
      });

      // ---------- initialisation ----------
      function init() {
        // set default movie (first one) as selected
        selectedMovieId = 0;
        updateActiveMovieCard();

        // render seats with current state (selectedSeats empty)
        selectedSeats.clear();
        renderSeats();

        // update summary & button
        updateSummary();
        updateBookButtonState();

        // set initial message
        const movie = getCurrentMovie();
        bookingMessage.textContent = `🎬 ${movie.title} · $${movie.price.toFixed(2)} per ticket`;
      }

      init();
    })();
  </script>
</body>
</html>
